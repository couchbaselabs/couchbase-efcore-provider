name: EF Core specification tests

# Runs EF Core's provider specification suites against a 3-node Couchbase cluster (allocated
# with cbdinocluster) and compares the results with
# tests/Couchbase.EntityFrameworkCore.Specification.Tests/known-failures.txt. The run fails only
# on a failure, or an aborted test class, that is not in that list; tests that now pass are
# reported. See CONTRIBUTING.md.
#
# The classes are split into two shards, each run on its own runner and cluster, balanced by the
# per-class times in scripts/class-times.tsv: about 3 hours, against about 6 for one job. That is
# too long to gate PRs, so it runs nightly on main and by hand (Actions → Run workflow).

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: "Couchbase Server version"
        required: false
        default: "8.0.1"
        type: string
      classes:
        description: "Optional class-name fragments to run, space-separated (default: all)"
        required: false
        default: ""
        type: string
  # Nightly on main, with the defaults above (scheduled runs have no inputs).
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: spec-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  CBDINOCLUSTER_VERSION: v0.0.131
  SPEC_PROJECT: tests/Couchbase.EntityFrameworkCore.Specification.Tests

jobs:
  spec-tests:
    name: spec-tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # One shard's new failures shouldn't hide the other's results.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # A shard takes about 3 hours; GitHub's limit is 6.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The spec project has no packages.lock.json (it references the Aspire AppHost for local
      # runs without a cluster), so it restores without --locked-mode, as in ci.yml.
      - name: Restore
        run: dotnet restore "$SPEC_PROJECT/Couchbase.EntityFrameworkCore.Specification.Tests.csproj"

      - name: Build
        run: dotnet build "$SPEC_PROJECT/Couchbase.EntityFrameworkCore.Specification.Tests.csproj" --configuration Release --no-restore

      - name: Install cbdinocluster
        run: |
          mkdir -p "$HOME/bin"
          wget -nv -O "$HOME/bin/cbdinocluster" \
            "https://github.com/couchbaselabs/cbdinocluster/releases/download/${CBDINOCLUSTER_VERSION}/cbdinocluster-linux-amd64"
          chmod +x "$HOME/bin/cbdinocluster"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize cbdinocluster
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cbdinocluster -v init --auto

      # The same shape as the cluster the baseline was taken on: 3 nodes, each with data, query,
      # index and search, and a "default" bucket with one replica. The suites create their own
      # scopes and collections in it. Multi-node matters: a single node hides the node-pinning
      # that SQL++ transactions depend on.
      - name: Start Couchbase cluster
        env:
          SERVER_VERSION: ${{ inputs.server_version || '8.0.1' }}
        run: |
          cat > cluster.yml <<YAML
          nodes:
            - count: 3
              version: ${SERVER_VERSION}
              services: [kv, n1ql, index, fts]
          buckets:
            default:
              settings:
                ram-quota-mb: 256
                num-replicas: 1
          YAML
          cat cluster.yml
          CLUSTER_ID=$(cbdinocluster -v alloc --def="$(cat cluster.yml)")
          CONNSTR=$(cbdinocluster connstr "$CLUSTER_ID")
          echo "Cluster $CLUSTER_ID: $CONNSTR"
          {
            echo "CBDINO_CLUSTER_ID=$CLUSTER_ID"
            echo "COUCHBASE_CONNECTION_STRING=$CONNSTR"
            echo "COUCHBASE_USERNAME=Administrator"
            echo "COUCHBASE_PASSWORD=password"
            echo "COUCHBASE_BUCKET=default"
          } >> "$GITHUB_ENV"

      # One test process per class; compares with known-failures.txt and exits non-zero only on
      # failures or aborted classes that are not in it.
      - name: Run specification tests
        env:
          CLASSES: ${{ inputs.classes }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # CLASSES is a space-separated list of filters.
          "$SPEC_PROJECT/scripts/run-suites.sh" --no-build --shard "${{ matrix.shard }}/2" \
            --out "$RUNNER_TEMP/spec-results" $CLASSES \
            | tee "$RUNNER_TEMP/spec-run.log"

      - name: Summary
        if: always()
        run: |
          results="$RUNNER_TEMP/spec-results"
          [ -f "$results/summary.tsv" ] || exit 0
          {
            echo '## EF Core specification tests, shard ${{ matrix.shard }}/2'
            echo
            echo '```'
            # Capped: a step summary is limited to 1 MB, and a first run can list many tests.
            python3 "$SPEC_PROJECT/scripts/compare-baseline.py" --results "$results" | head -n 300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # TRX files and the per-class summary: for investigating failures, and for regenerating
      # known-failures.txt from a CI run (compare-baseline.py --results <shard dirs> --update).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-test-results-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/spec-results
            ${{ runner.temp }}/spec-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove cluster
        if: always() && env.CBDINO_CLUSTER_ID != ''
        run: cbdinocluster rm "$CBDINO_CLUSTER_ID" || true
